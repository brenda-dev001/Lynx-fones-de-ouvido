<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Fones Pulse</title>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho__container">
            <a class="cabecalho__link" href="#">
                <img src="/src/assets/icons/svg_icone-pulse.svg" alt="icone de música">
            </a>
            <h1>pulse</h1>
        </div>
        <nav class="cabecalho__nav">
            <a href="#">início</a>
            <a href="#">recursos</a>

            <button class="cabecalho__botton"><img src="/src/assets/icons/svg_carrinho-branco.svg" alt="icone de carrinho">

        </div>
    </header>
    <main>
        <article class="hero">
            <div class="hero__container-lancamento">
                <span>novo lançamento</span>

                <div class="hero__container-botoes">
                    <button id="botao-comprar">Comprar agora</button>
                    <a href="#" id="botao-saiba-mais">Saiba mais<i class="bi bi-arrow-down-short"></i></a>
                </div>
            </div>
            <div class="hero__container-imagem
            "><img src="/src/assets/images/png_imagem-fone.png" alt="imagem ilustrativa do fone de ouvido"></div>
        </article>
    </main>
    <footer>

    </footer>
